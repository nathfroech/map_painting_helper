suspicious = "deny"
complexity = "deny"
perf = "deny"

[dependencies]
env-settings = "0.1.15"
env-settings-derive = "0.1.15"
env-settings-utils = "0.1.15"
jomini = "0.34.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
encoding_rs = "0.8.35"
tempfile = "3"
