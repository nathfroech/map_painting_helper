[package]
name = "parser"
version = "0.0.1"
categories = ["clausewitz"]
edition = "2024"
keywords = ["parser"]
license-file = "../LICENSE"
readme = "../README.md"
repository = "https://github.com/nathfroech/map_painting_helper"
description = "Parser"

[lints.clippy]
cargo = "deny"
nursery = "deny"
pedantic = "deny"
style = "deny"
correctness = "deny"
suspicious = "deny"
complexity = "deny"
perf = "deny"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
env-settings = "0.1.15"
env-settings-derive = "0.1.15"
env-settings-utils = "0.1.15"
jomini = "0.34.1"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
encoding_rs = "0.8.35"
tempfile = "3.27.0"

[features]
default = []
python = ["pyo3"]
